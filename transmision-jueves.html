<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d14"><title>Transmisión en vivo · Jueves · UTA Sumo</title>
<style>
:root{--bg:#090d14;--panel:#111a27;--panel2:#172436;--line:#26384c;--muted:#91a5bf;--white:#f4f7fc;--blue:#64a4ff;--red:#ff6277;--gold:#ffcb5c;--green:#4bd2a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -25%,#263d5a 0,transparent 55%),var(--bg);color:var(--white);font:16px/1.4 Inter,system-ui,"Segoe UI",sans-serif}.wrap{max-width:1920px;margin:auto;padding:clamp(14px,2.4vw,38px)}header{display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{display:flex;align-items:center;gap:14px}.mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(140deg,#356ce5,#45bad0);font-size:22px;font-weight:900}.eyebrow{color:#8cbaff;text-transform:uppercase;font-size:11px;letter-spacing:.18em;font-weight:900}.brand h1{font-size:clamp(17px,2vw,25px);margin:1px 0}.live{display:flex;align-items:center;gap:8px;color:#9ce9c9;font-size:12px;font-weight:900;letter-spacing:.1em;border:1px solid #245b4b;background:#12352d;padding:8px 12px;border-radius:99px}.pulse{height:8px;width:8px;background:#4be0a8;border-radius:50%;box-shadow:0 0 12px #4be0a8}.phasebar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:20px 0 16px}.phasebar h2{font-size:clamp(24px,3.5vw,43px);letter-spacing:-.04em;margin:0}.phasebar p{margin:4px 0 0;color:var(--muted);font-size:13px}.phases{display:flex;gap:7px;flex-wrap:wrap}.phase{border:1px solid var(--line);color:#b7c6da;background:#111a27;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:850}.phase.active{background:#1e4d83;border-color:#61a5ff;color:white}.demo{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #6b5424;background:#322711;color:#ffdb87;border-radius:8px;font-weight:800;font-size:11px;letter-spacing:.06em;margin:3px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.court{--accent:#75aaff;position:relative;overflow:hidden;background:linear-gradient(145deg,#172538,#111a27);border:1px solid var(--line);border-radius:17px;padding:clamp(15px,2.1vw,27px);box-shadow:0 18px 60px #0005}.court:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}.court-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.court-label{color:var(--accent);font-size:10px;letter-spacing:.16em;font-weight:950}.court-head h3{margin:3px 0 0;font-size:clamp(16px,2vw,23px)}.court-sub{color:var(--muted);font-size:11px}.badge{font-size:10px;letter-spacing:.08em;font-weight:900;color:#dce8f8;background:#27384e;padding:6px 9px;border-radius:99px;white-space:nowrap}.pair{display:grid;grid-template-columns:1fr 68px;align-items:center;gap:10px;border:1px solid #34465c;background:#0d1520;border-radius:13px;padding:clamp(12px,1.7vw,20px);margin:9px 0}.pair.won{border-color:#3c9b77}.color{font-size:9px;letter-spacing:.12em;font-weight:950;margin-bottom:3px}.color.red{color:#ff8392}.color.blue{color:#83b9ff}.robot{font-size:clamp(17px,2.4vw,29px);font-weight:900;line-height:1.1}.team{font-size:clamp(11px,1.3vw,15px);color:#c3d0e1;margin-top:4px}.school{font-size:10px;color:#8398b2;margin-top:2px}.score{font-size:clamp(38px,5.3vw,70px);font-weight:950;text-align:center;line-height:1;font-variant-numeric:tabular-nums}.vs{text-align:center;color:#697e98;font-size:10px;font-weight:900;letter-spacing:.2em;margin:-3px 0}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#93a7c0;font-size:11px;margin-top:13px}.winner{color:#82e5bb;font-weight:900}.rounds{display:flex;gap:5px;align-items:center}.round-dot{width:14px;height:14px;border:1px solid #52657e;border-radius:50%}.round-dot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px #ffcb5c66}.screen-button{position:fixed;right:18px;bottom:18px;border:1px solid #456487;background:#17283c;color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.champion{margin-top:17px;text-align:center;padding:18px;border:1px solid #665521;background:linear-gradient(90deg,#251e0e,#3a2c11,#251e0e);border-radius:15px}.champion strong{display:block;font-size:clamp(19px,3vw,34px);color:var(--gold)}.champion span{font-size:10px;letter-spacing:.16em;color:#ffdf8e;font-weight:900}.empty{padding:24px;color:var(--muted);text-align:center}.screen .phasebar,.screen .demo,.screen .screen-button{display:none!important}.screen .wrap{max-width:none;padding:15px}.screen header{padding-bottom:10px}.screen .grid{gap:10px}.screen .court{padding:15px}.screen .pair{padding:10px;margin:6px 0}.screen .robot{font-size:clamp(19px,2.4vw,34px)}.screen .score{font-size:clamp(45px,6vw,76px)}@media(max-width:780px){.phasebar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.screen .grid{grid-template-columns:1fr}.live{font-size:10px}}@media(min-width:1500px){.court{padding:28px}.pair{padding:23px}.grid{gap:18px}}
</style></head><body><main class="wrap"><header><div class="brand"><div class="mark">UTA</div><div><div class="eyebrow">Sumo Robotics Cup · Jueves 29</div><h1>Transmisión oficial · Dohyos 1–4</h1></div></div><div class="live"><i class="pulse"></i> ENCUENTRO EN VIVO</div></header><section class="phasebar"><div><h2 id="title">Fase de grupos</h2><p id="subtitle">Un combate simultáneo por grupo · Primero en ganar 2 Yukos</p></div><nav class="phases" id="phases"></nav></section><div class="demo">VISTA DEMOSTRATIVA · marcadores de ejemplo, no resultados oficiales</div><section class="grid" id="courts"></section><div id="champion"></div></main><button class="screen-button" id="screen">⛶ Pantalla completa</button>
<script>
(()=>{'use strict';const roster={A:[['Iron Gears','Camilito'],['TriForce','Fury Titán'],['The Winds','Aguacate'],['Los tilines','Tilinaso'],['KillerBOT','Bot sin IA']],B:[['Argo','Miniso'],['Team Core Robot','Kaio-bot'],['ORION','ORION'],['Los seguidores de Jesús','ZuZ'],['EQUIPO DINAMITA','NEXUS']],C:[['Los LTK','Chipi'],['Invictus','Atom'],['SHADOW FORCE','SAMURAI-XX'],['Smart-U','Atom'],['Trio de Mosqueteras','JDJ']],D:[['Los Ingebots','Robobit'],['Los Guerreros Z','Super Sayayin'],['Torque control','Willi'],['ROBATRONIC','Maquina del mal'],['ZETAVOX','Zerox'],['Los indestructibles','AMBUSH']]};const teams={};Object.entries(roster).forEach(([g,list])=>teams[g]=list.map(([team,robot],i)=>({id:`${g}${i+1}`,team,robot})));const get=id=>Object.values(teams).flat().find(t=>t.id===id);const phases=['Grupos','Cuartos','Semifinales','3.º / 4.º','Final'];let selected='Grupos';
const groupData=[['A',0,'A1','A2',0,0,2],['B',1,'B1','B2',0,0,2],['C',2,'C1','C2',0,0,2],['D',3,'D1','D2',0,0,2]];
const qf=[['Cuartos · Llave 1',0,'A1','B2',2,0,2],['Cuartos · Llave 2',1,'C1','D2',1,2,2],['Cuartos · Llave 3',2,'B1','A2',1,2,2],['Cuartos · Llave 4',3,'D1','C2',2,0,2]];
const sf=[['Semifinal 1',0,'A1','D2',2,1,2],['Semifinal 2',1,'A2','D1',2,0,2]];
const bronze=[['Combate por el 3.º lugar',0,'D2','D1',2,1,2]];
const final=[['Gran final',0,'A1','A2',3,2,3]];
const info={Grupos:['Fase de grupos','Cuatro combates a la vez · cada grupo juega todos contra todos'],Cuartos:['Cuartos de final','Cuatro llaves simultáneas · mejor de 3 Yukos'],Semifinales:['Semifinales','Dos combates en paralelo · dohyos 1 y 2 · mejor de 3'], '3.º / 4.º':['Definición del tercer lugar','Perdedores de semifinales · combate por el 3.º puesto · mejor de 3'],'Final':['Gran final','Ganadores de semifinales · mejor de 5 · primero en ganar 3 Yukos']};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(data,phase){const[name,court,aId,bId,sa,sb,target]=data,a=get(aId),b=get(bId),winner=sa===target?a:sb===target?b:null,meta=phase==='Grupos'?`Grupo ${name} · combate de muestra`:name;return `<article class="court" style="--accent:${['#71a9ff','#c39bff','#5ce0b2','#ffc466'][court]}"><div class="court-head"><div><div class="court-label">DOHYO ${court+1} · ${esc(phase==='Grupos'?'GRUPO '+name:name.toUpperCase())}</div><h3>${esc(meta)}</h3><div class="court-sub">${phase==='Final'?'Mejor de 5 · primero a 3 Yukos':'Mejor de 3 · primero a 2 Yukos'}</div></div><span class="badge">${winner?'FINAL DE EJEMPLO':'MARCADOR DE EJEMPLO'}</span></div>${fighter(a,'red',sa,winner)}<div class="vs">VS</div>${fighter(b,'blue',sb,winner)}<div class="footer"><span class="${winner?'winner':''}">${winner?'🏆 Ganador de muestra: '+esc(winner.team):'Marcador de muestra'}</span><span class="rounds">Yukos para ganar ${target} ${Array.from({length:target},(_,i)=>`<i class="round-dot ${i<Math.max(sa,sb)?'on':''}"></i>`).join('')}</span></div></article>`}function fighter(t,color,s,w){return `<div class="pair ${w===t?'won':''}"><div><div class="color ${color}">${color==='red'?'ESQUINA ROJA':'ESQUINA AZUL'}</div><div class="robot">${esc(t.robot)}</div><div class="team">${esc(t.team)}</div></div><div class="score">${s}</div></div>`}
function render(){document.getElementById('phases').innerHTML=phases.map(p=>`<button class="phase ${p===selected?'active':''}" data-phase="${esc(p)}">${esc(p)}</button>`).join('');document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{selected=b.dataset.phase;render()});document.getElementById('title').textContent=info[selected][0];document.getElementById('subtitle').textContent=info[selected][1];let data=selected==='Grupos'?groupData:selected==='Cuartos'?qf:selected==='Semifinales'?sf:selected==='3.º / 4.º'?bronze:final;document.getElementById('courts').innerHTML=data.map(row=>card(row,selected)).join('');document.getElementById('champion').innerHTML=selected==='Final'?'<div class="champion"><span>CAMPEÓN · RESULTADO DE EJEMPLO</span><strong>Iron Gears</strong>Subcampeón: The Winds</div>':''}
document.getElementById('screen').onclick=async()=>{try{await document.documentElement.requestFullscreen()}catch{}};document.addEventListener('fullscreenchange',()=>{document.getElementById('screen').textContent=document.fullscreenElement?'Salir de pantalla completa':'⛶ Pantalla completa'});render();})();
</script></body></html>
